<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181530" />
      <stop offset="100%" stop-color="#07060d" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="neonMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#c026d3" />
    </linearGradient>
    <linearGradient id="neonViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="#22d3ee" stroke-width="4" stroke-opacity="0.35" />

  <!-- D20 Geometric facets -->
  <g transform="translate(256, 256)" filter="url(#neonGlow)">
    <!-- Central Triangle -->
    <polygon points="0,-120 104,60 -104,60" fill="#13112c" stroke="#22d3ee" stroke-width="5" />
    
    <!-- Top left facet -->
    <polygon points="0,-120 -104,60 -130,-50" fill="#19163a" stroke="#818cf8" stroke-width="4" />
    
    <!-- Top right facet -->
    <polygon points="0,-120 104,60 130,-50" fill="#1e1845" stroke="#c084fc" stroke-width="4" />

    <!-- Top facet -->
    <polygon points="0,-120 -130,-50 0,-170 130,-50" fill="#151233" stroke="#e879f9" stroke-width="3" />

    <!-- Bottom facet -->
    <polygon points="-104,60 104,60 0,160" fill="#120f29" stroke="#38bdf8" stroke-width="4" />

    <!-- Bottom Left facet -->
    <polygon points="-104,60 -130,-50 -140,80 0,160" fill="#0d0a22" stroke="#8b5cf6" stroke-width="3" />

    <!-- Bottom Right facet -->
    <polygon points="104,60 130,-50 140,80 0,160" fill="#0e0c24" stroke="#e879f9" stroke-width="3" />

    <!-- Inner 20 text -->
    <text x="0" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="1">
      20
    </text>
  </g>
</svg>
